<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR ໂຕະ · Sabaidee Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #FF7A30; --success: #2D9B6B; --accent: #FFB020;
            --bg: #EDEAE3; --surface: #FFFFFF; --border: #EDE8E0;
            --text: #1A1A1A; --muted: #999999; --nav: #1A1A2E;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); min-height: 100vh; }

        .nav { background: var(--nav); display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { color: #fff; font-size: 14px; font-weight: 700; padding: 14px 0; margin-right: 24px; }
        .nav-tabs { display: flex; flex: 1; }
        .nav-tab { padding: 14px 16px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45); cursor: pointer; border-bottom: 2px solid transparent; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .nav-tab .lo { font-size: 11px; } .nav-tab .en { font-size: 8px; opacity: 0.5; }
        .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .body { padding: 20px; max-width: 900px; margin: 0 auto; }
        .page-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .page-sub { font-size: 11px; color: var(--muted); margin-bottom: 20px; }

        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
        .controls select {
            padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 13px; font-family: 'Poppins', sans-serif; color: var(--text);
            background: var(--surface); outline: none; cursor: pointer; min-width: 160px;
        }
        .controls select:focus { border-color: var(--primary); }
        .btn {
            padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; border: none;
            display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
        .btn-nav { background: var(--nav); color: #fff; }

        .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }

        .qr-card {
            background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
            padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .qr-num { font-size: 15px; font-weight: 700; color: var(--text); text-align: center; }
        .qr-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
        .qr-img-wrap {
            width: 150px; height: 150px; border-radius: 10px; border: 1px solid var(--border);
            overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff;
        }
        .qr-img-wrap canvas, .qr-img-wrap img { width: 100% !important; height: 100% !important; }
        .qr-url { font-size: 9px; color: var(--muted); text-align: center; word-break: break-all; line-height: 1.4; }
        .btn-dl {
            display: block; width: 100%; padding: 8px; background: var(--primary); color: #fff;
            border-radius: 8px; font-size: 11px; font-weight: 600; text-align: center;
            text-decoration: none; font-family: 'Poppins', sans-serif; border: none; cursor: pointer;
        }
        .btn-dl:hover { opacity: 0.85; }

        .empty-hint { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }

        @media print {
            .nav, .controls, .btn-dl { display: none !important; }
            .body { padding: 0; max-width: 100%; }
            .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
            .qr-card { break-inside: avoid; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-brand">🐘 Sabaidee</div>
    <div class="nav-tabs">
        <a href="/admin/dashboard" class="nav-tab"><span class="lo">ໜ້າຫຼັກ</span><span class="en">Dashboard</span></a>
        <a href="/admin/analytics" class="nav-tab"><span class="lo">ສະຖິຕິ</span><span class="en">Analytics</span></a>
        <a href="/admin/menu" class="nav-tab"><span class="lo">ເມນູ</span><span class="en">Menu</span></a>
        <a href="/admin/qr-tables" class="nav-tab active"><span class="lo">QR ໂຕະ</span><span class="en">QR Tables</span></a>
    </div>
</nav>

<div class="body">
    <div class="page-title">QR ໂຕະ · QR Tables</div>
    <div class="page-sub">{{ restaurant.name }} · {{ tables|length }} ໂຕະ</div>

    <div class="controls">
        <label for="table-select">ເລືອກໂຕະ · Select table:</label>
        <select id="table-select" onchange="addTableQR()">
            <option value="">— choose —</option>
            {% for table in tables %}
            <option value="{{ table.id }}" data-number="{{ table.number }}" data-label="{{ table.label or '' }}">
                ໂຕະ {{ table.number }}{% if table.label %} · {{ table.label }}{% endif %}
            </option>
            {% endfor %}
        </select>
        <button class="btn btn-outline" onclick="addAllTables()">+ Add all</button>
        <button class="btn btn-outline" onclick="clearGrid()">✕ Clear</button>
        <button class="btn btn-nav" onclick="window.print()">🖨️ Print</button>
    </div>

    <div class="qr-grid" id="qr-grid">
        <div class="empty-hint" id="empty-hint">← Choose a table to generate its QR code</div>
    </div>
</div>

<script>
    const BASE_URL = "{{ request.base_url }}menu/{{ restaurant.id }}";
    const addedIds = new Set();

    const TABLES = [
        {% for table in tables %}
        { {{ table.id }}, {{ table.number }}, "{{ table.label or '' }}" },
        {% endfor %}
    ]

    function addTableQR() {
        const sel = document.getElementById('table-select');
        const opt = sel.options[sel.selectedIndex];
        if (!opt.value) return;

        const tableId = parseInt(opt.value);
        const number = opt.dataset.number;
        const label = opt.dataset.label;

        generateCard(tableId, number, label);
        sel.value = '';  // сбросить выпадашку
    }

    function addAllTables() {
        TABLES.forEach(t => generateCard(t.id, t.number, t.label));
    }

    function generateCard(tableId, number, label) {
        if (addedIds.has(tableId)) return;  // уже есть в гриде
        addedIds.add(tableId);

        document.getElementById('empty-hint').style.display = 'none';

        const url = `${BASE_URL}/${tableId}`;
        const cardId = `card-${tableId}`;

        const card = document.createElement('div');
        card.className = 'qr-card';
        card.id = cardId;
        card.innerHTML = `
            <div>
                <div class="qr-num">ໂຕະ ${number}</div>
                ${label ? `<div class="qr-label">${label}</div>` : ''}
            </div>
            <div class="qr-img-wrap" id="qr-wrap-${tableId}"></div>
            <div class="qr-url">${url}</div>
            <button class="btn-dl" onclick="downloadQR(${tableId}, ${number})">⬇ Download</button>
        `;
        document.getElementById('qr-grid').appendChild(card);

        // генерация QR на клиенте
        new QRCode(document.getElementById(`qr-wrap-${tableId}`), {
            text: url,
            width: 150,
            height: 150,
            colorDark: "#1A1A2E",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    function downloadQR(tableId, number) {
        const wrap = document.getElementById(`qr-wrap-${tableId}`);
        const canvas = wrap.querySelector('canvas');
        if (!canvas) {
            // qrcode.js иногда рендерит img вместо canvas в некоторых браузерах
            const img = wrap.querySelector('img');
            if (img) {
                const a = document.createElement('a');
                a.href = img.src;
                a.download = `qr_table_${number}.png`;
                a.click();
            }
            return;
        }
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `qr_table_${number}.png`;
        a.click();
    }

    function clearGrid() {
        addedIds.clear();
        const grid = document.getElementById('qr-grid');
        grid.innerHTML = '<div class="empty-hint" id="empty-hint">← Choose a table to generate its QR code</div>';
    }
</script>

</body>
</html>
